name: Deploy website (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      # Skip quietly (instead of failing) until the FIREBASE_SERVICE_ACCOUNT secret has been added.
      - name: Check deploy secret
        id: gate
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret is not set - skipping deploy"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.gate.outputs.go == 'true'
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: smartedit-2000
          channelId: live
